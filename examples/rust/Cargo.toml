[package]
name = "sodae-examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
bs58 = "0.5"
futures = "0.3"
solana-pubkey = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
yellowstone-grpc-client = "14"
yellowstone-grpc-proto = "14"
